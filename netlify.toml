# Netlify deployment config for ROP Connect (Vite SPA + PWA).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Remote MCP server for external agents (e.g. Hyperagent): chat.ropsalons.com/mcp/<agent-token>.
# These must come BEFORE the SPA catch-all so they hit the function, not index.html.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
# OAuth: discovery, dynamic client registration, authorize, token — all handled by the MCP function.
[[redirects]]
  from = "/.well-known/oauth-protected-resource*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
[[redirects]]
  from = "/.well-known/oauth-authorization-server*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
[[redirects]]
  from = "/.well-known/openid-configuration*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
# Per-token authorization-server paths (…/as/<token> and its .well-known metadata).
[[redirects]]
  from = "/as/*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# SPA fallback: let React Router handle client-side routes on refresh/deep-link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker or the app shell HTML — always revalidate.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-cache fingerprinted build assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

name: Deploy ROP Connect to GitHub Pages

# Builds on GitHub's runners (which have network access) and publishes to GitHub Pages.
# The Supabase anon key is safe to expose (RLS enforces all access), so it is inlined here
# rather than kept as a secret.

on:
  push:
    branches: [claude/rop-connect-messaging-app-texv5n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          DEPLOY_BASE: /rop-conciergephone/
          VITE_SUPABASE_URL: https://qrigzwactbwbpuufehxo.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyaWd6d2FjdGJ3YnB1dWZlaHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDY1NTAsImV4cCI6MjA5NTgyMjU1MH0.clfVimJMuFEc_6YZO6RmItPntDxJKFlQ-7ug7HAqSDA
          VITE_APP_ENV: production
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

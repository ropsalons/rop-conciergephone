name: Deploy to Netlify

# Publishes rop-connect.netlify.app on every push to the working branch.
#
# This BUILDS FRESH from source in CI (it no longer deploys a committed dist/).
# History: dist/ is gitignored, so committing a pre-built dist meant `git add -A`
# silently skipped new fingerprinted chunks — index.html would reference a JS file
# that was never committed/deployed, and every visitor got a blank screen. Building
# in CI makes the source the single source of truth, and the completeness guard below
# refuses to ship if index.html points at any asset the build didn't produce.
#
# The Supabase anon key is safe to expose (RLS enforces all access), so it is inlined
# for the build, exactly like deploy-pages.yml. Deploy needs one repository secret:
# NETLIFY_AUTH_TOKEN. Site id is not secret (inlined).

on:
  push:
    branches:
      - claude/rop-connect-messaging-app-texv5n
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: https://qrigzwactbwbpuufehxo.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyaWd6d2FjdGJ3YnB1dWZlaHhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDY1NTAsImV4cCI6MjA5NTgyMjU1MH0.clfVimJMuFEc_6YZO6RmItPntDxJKFlQ-7ug7HAqSDA
          VITE_APP_ENV: production
        run: npm run build

      - name: Guard — refuse to deploy an incomplete build
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }
          missing=0
          for f in $(grep -oE '/assets/[A-Za-z0-9._-]+\.(js|css)' dist/index.html | sort -u); do
            if [ ! -f "dist${f}" ]; then
              echo "::error::index.html references dist${f} but the build did not produce it"
              missing=1
            else
              echo "ok: dist${f}"
            fi
          done
          if [ "$missing" != "0" ]; then
            echo "::error::Build is incomplete — refusing to deploy (this is the blank-screen guard)."
            exit 1
          fi
          echo "All referenced assets present — safe to deploy."

      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: e6d7215b-dc6d-4adb-9300-124d114f1849
        run: npx --yes netlify-cli@17 deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"

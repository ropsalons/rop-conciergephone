name: Deploy to Netlify

# Publishes rop-connect.netlify.app on every push to the working branch.
#
# IMPORTANT: this deploys the COMMITTED dist/ as-is — it does NOT rebuild.
# The build is produced locally (where the VITE_SUPABASE_* env vars live) and committed
# with each change. Rebuilding in CI without those env vars would ship an app that can't
# reach Supabase ("configuration needed"), so we intentionally skip the build step.
#
# Requires one repository secret: NETLIFY_AUTH_TOKEN. Site id is not secret (inlined).

on:
  push:
    branches:
      - claude/rop-connect-messaging-app-texv5n
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish committed dist to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: e6d7215b-dc6d-4adb-9300-124d114f1849
        run: npx --yes netlify-cli@17 deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
